name: CI - Build, Test, and Pack

permissions:
  contents: read

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./src

    strategy:
      matrix:
        dotnet-version: ["8.0.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Fetch all history for nbgv to calculate version

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore Microsoft.Agents.A365.Sdk.sln

      - name: Build solution
        run: dotnet build Microsoft.Agents.A365.Sdk.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Microsoft.Agents.A365.Sdk.sln --no-build --configuration Release --verbosity normal
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}

      - name: Pack
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP "agent365-packages-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $outputPath | Out-Null
          dotnet pack Microsoft.Agents.A365.Sdk.sln --no-build --configuration Release --output $outputPath
          if ($LASTEXITCODE -ne 0) { throw "Pack failed" }
          if (Get-ChildItem -LiteralPath $outputPath -Filter 'Microsoft.Agents.A365.Observability.*' -File) {
            throw "Retired Observability packages must not be released."
          }
          if (-not (Get-ChildItem -LiteralPath $outputPath -Filter '*.nupkg' -File)) {
            throw "Pack produced no NuGet packages."
          }
          "PACKAGE_OUTPUT=$outputPath" >> $env:GITHUB_ENV

      - name: Upload NuGet packages as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-packages-${{ github.run_number }}
          path: ${{ env.PACKAGE_OUTPUT }}/*
          if-no-files-found: error
